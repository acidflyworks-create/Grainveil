name: Temporary sound test report transfer
on:
  workflow_dispatch:
    inputs:
      run_id:
        type: string
        required: true
permissions:
  contents: write
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/12085b27-grainveil
      - uses: actions/download-artifact@v4
        with:
          name: Grainveil-test-log-Windows
          path: input/windows
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Grainveil-test-log-macOS
          path: input/macos
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Transfer sound measurement summary
        env:
          SOURCE_RUN: ${{ inputs.run_id }}
        run: |
          python3 - <<'PY'
          import os,pathlib
          output=['run: '+os.environ['SOURCE_RUN']]
          for platform in ['windows','macos']:
              logs=list(pathlib.Path('input',platform).rglob('LastTest.log'))
              if len(logs)!=1: raise SystemExit(f'missing {platform} test log')
              lines=logs[0].read_text(errors='replace').splitlines()
              selected=[x for x in lines if x.startswith(('Short-grain wet peak','Mode ', '50% mix difference', 'Frozen long-grain RMS', '32-voice 48k/128 stress'))]
              if len(selected)!=9: raise SystemExit(f'incomplete {platform} measurements: {selected}')
              output += ['\n'+platform]+selected
          dest=pathlib.Path('transfer/sound-summary.txt');dest.parent.mkdir(exist_ok=True)
          dest.write_text('\n'.join(output)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add transfer/sound-summary.txt
          git commit -m 'Temporary sound test report transfer [skip ci]'
          git push origin HEAD:arena/12085b27-grainveil
