name: Build plugins (Windows / macOS)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the built plugins to a GitHub Release"
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: Windows x64 (VST3)
            artifact: Grainveil-Windows-x64
          # macos-14 was retired by GitHub in November 2026; macos-15 (Xcode 16)
          # still cross-compiles the x86_64 slice of the universal binary.
          - runner: macos-15
            label: macOS universal (VST3 + AU)
            artifact: Grainveil-macOS-universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate factory preset source and generated files
        run: python tools/generate_factory_presets.py --check

      - name: Validate UI font coverage, asset size and hashes
        shell: bash
        run: |
          python tools/check_font_glyphs.py
          python tools/size_report.py --output build-reports/assets.json

      - name: Toolchain
        shell: bash
        run: |
          cmake --version
          git --version

      - name: Configure (Windows, MSVC x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DGRAINVEIL_BUILD_UI_TESTS=ON

      - name: Configure (macOS, universal x86_64 + arm64)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcodebuild -version
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGRAINVEIL_BUILD_UI_TESTS=ON \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Test layout and text fitting
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: Grainveil-UI-previews-${{ runner.os }}
          path: build/ui-previews/*.png
          if-no-files-found: error
          retention-days: 30

      - name: List artefacts
        shell: bash
        run: find build/Grainveil_artefacts -maxdepth 4 -print | sort

      - name: Check installed bundle size (Windows VST3)
        if: runner.os == 'Windows'
        run: python tools/size_report.py --bundle build/Grainveil_artefacts/Release/VST3/Grainveil.vst3 --output build-reports/Windows-VST3.json

      - name: Check installed bundle sizes (macOS VST3 and AU)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python tools/size_report.py --bundle build/Grainveil_artefacts/Release/VST3/Grainveil.vst3 --output build-reports/macOS-VST3.json
          python tools/size_report.py --bundle build/Grainveil_artefacts/Release/AU/Grainveil.component --output build-reports/macOS-AU.json

      - name: Upload asset and bundle size reports
        uses: actions/upload-artifact@v4
        with:
          name: Grainveil-size-reports-${{ runner.os }}
          path: build-reports/*.json
          if-no-files-found: error

      - name: Package and verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vst3 = 'build/Grainveil_artefacts/Release/VST3/Grainveil.vst3'
          if (-not (Test-Path -LiteralPath $vst3)) { throw "VST3 not found at $vst3" }
          $item = Get-Item -LiteralPath $vst3
          # JUCE 8 emits a VST3 *bundle* on Windows: Grainveil.vst3/Contents/x86_64-win/Grainveil.vst3
          # Older versions emitted a single PE file directly, so support both layouts.
          if ($item.PSIsContainer) {
            $inner = Get-ChildItem -LiteralPath $vst3 -Recurse -File -Filter '*.vst3' | Select-Object -First 1
            if ($null -eq $inner) { throw "VST3 bundle contains no .vst3 binary" }
            $binaryPath = $inner.FullName
            Get-ChildItem -LiteralPath $vst3 -Recurse | Select-Object FullName, Length
          } else {
            $binaryPath = $item.FullName
          }
          $bytes = [System.IO.File]::ReadAllBytes($binaryPath)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "VST3 does not look like a PE binary (missing MZ header): $binaryPath"
          }
          "PE binary: $binaryPath ($($bytes.Length) bytes, MZ header OK)"
          New-Item -ItemType Directory -Force -Path packages, package-staging/windows | Out-Null
          Copy-Item -LiteralPath $item.FullName -Destination 'package-staging/windows' -Recurse
          Copy-Item -LiteralPath 'LICENSE', 'THIRD_PARTY_LICENSES.md', 'assets/fonts/OFL.txt' -Destination 'package-staging/windows'
          Compress-Archive -Path 'package-staging/windows/*' -DestinationPath 'packages/Grainveil-VST3-Windows-x64.zip' -Force
          Get-FileHash -Algorithm SHA256 'packages/Grainveil-VST3-Windows-x64.zip' | Format-List

      - name: Package and verify (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          vst3='build/Grainveil_artefacts/Release/VST3/Grainveil.vst3'
          au='build/Grainveil_artefacts/Release/AU/Grainveil.component'
          test -d "$vst3" || { echo "VST3 bundle not found at $vst3"; exit 1; }
          binary="$vst3/Contents/MacOS/Grainveil"
          test -f "$binary" || { echo "VST3 binary not found at $binary"; exit 1; }
          file "$binary"
          lipo -info "$binary"
          plutil -lint "$vst3/Contents/Info.plist"
          test -d "$au" || { echo "AU bundle not found at $au"; exit 1; }
          mkdir -p packages package-staging/vst3 package-staging/au
          ditto "$vst3" package-staging/vst3/Grainveil.vst3
          ditto "$au" package-staging/au/Grainveil.component
          for format in vst3 au; do
            cp LICENSE THIRD_PARTY_LICENSES.md assets/fonts/OFL.txt "package-staging/$format/"
          done
          # Keep the bundle and license notices at the archive root. Do not modify
          # signed macOS bundles after linking.
          (cd package-staging/vst3 && ditto -c -k --sequesterRsrc . ../../packages/Grainveil-VST3-macOS-universal.zip)
          (cd package-staging/au && ditto -c -k --sequesterRsrc . ../../packages/Grainveil-AU-macOS-universal.zip)
          shasum -a 256 packages/*.zip

      - name: Verify distribution license notices
        shell: bash
        run: python tools/check_packages.py packages/*.zip

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/*.zip
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artefacts
        uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - name: List release assets and checksums
        run: |
          ls -lh artefacts
          sha256sum artefacts/*.zip | tee checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          cat > notes.md <<'EOF'
          Release build of the Grainveil stereo granular processor (JUCE 8.0.4).

          * `Grainveil-VST3-Windows-x64.zip` — VST3 for Windows x64 (MSVC 2022)
          * `Grainveil-VST3-macOS-universal.zip` — VST3 for macOS, universal (Intel + Apple Silicon)
          * `Grainveil-AU-macOS-universal.zip` — Audio Unit for macOS (bonus)

          Install: unzip and copy `Grainveil.vst3` to the system VST3 folder
          (`C:\Program Files\Common Files\VST3\` on Windows,
          `~/Library/Audio/Plug-Ins/VST3/` on macOS). Unsigned builds: on macOS remove
          the quarantine attribute with `xattr -dr com.apple.quarantine Grainveil.vst3`.
          EOF
          {
            echo
            echo "## SHA-256 checksums"
            echo '```'
            cat checksums.txt
            echo '```'
          } >> notes.md
          gh release create "$TAG" artefacts/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Grainveil $TAG" \
            --notes-file notes.md \
            --latest=false
